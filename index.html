<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JEE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c3e2d">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --paper:#f6f1e4;
    --paper-2:#efe6d0;
    --ink:#2f2a20;
    --muted:#8a7d63;
    --navy:#2c3e2d;
    --navy-2:#3d5540;
    --line:#d8cbaa;
    --gold:#b9862f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--ink); font-family:'Inter',sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(180,160,120,0.12) 28px),
      var(--paper);
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; background:var(--navy); border-bottom:3px solid var(--gold); flex-shrink:0;
  }
  header h1{
    font-family:'Merriweather',serif; font-size:20px; font-weight:700; margin:0; color:var(--paper);
    letter-spacing:0.5px;
  }
  #research-btn{
    display:flex; align-items:center; gap:6px; background:var(--navy-2); border:1px solid var(--gold);
    color:var(--paper); padding:8px 14px; border-radius:20px; cursor:pointer; font-size:13.5px;
    font-family:'Inter',sans-serif; font-weight:600;
  }
  #research-btn:hover{background:var(--gold); color:var(--navy);}
  #research-btn svg{width:16px; height:16px;}
  main{flex:1; overflow-y:auto; padding:20px 16px 96px; display:flex; flex-direction:column; gap:14px;}
  #status{font-size:12px; color:var(--muted); text-align:center;}
  #empty-state{
    margin:auto; text-align:center; color:var(--muted); max-width:280px; font-size:14px; line-height:1.6;
  }
  #empty-state svg{width:48px; height:48px; margin-bottom:10px; color:var(--gold);}
  #pdf-card{
    display:none; background:#ffffff; border:1px solid var(--line); border-radius:10px; overflow:hidden;
    box-shadow:0 4px 14px rgba(44,62,45,0.15);
  }
  #pdf-toolbar{
    display:flex; align-items:center; justify-content:space-between; padding:10px 14px;
    background:var(--paper-2); border-bottom:1px solid var(--line); font-size:13px; color:var(--ink);
  }
  #pdf-toolbar b{font-family:'Merriweather',serif; font-size:13.5px;}
  #pdf-toolbar a{color:var(--navy); font-weight:600; text-decoration:none;}
  #pdf-frame{width:100%; height:70vh; border:none; display:block;}
  #upload-zone{
    border:2px dashed var(--line); border-radius:12px; padding:32px 18px; text-align:center;
  }
  #upload-zone p{color:var(--muted); font-size:13.5px; margin:8px 0 16px;}
  #upload-btn{
    background:var(--navy); color:var(--paper); border:none; border-radius:20px; padding:11px 24px;
    font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  #upload-btn:hover{background:var(--navy-2);}
  input[type="file"]{display:none;}
  #bottom-bar{
    position:fixed; left:0; right:0; bottom:0; background:var(--navy); border-top:3px solid var(--gold);
    padding:12px 16px; display:flex; gap:10px; justify-content:flex-end;
  }
  #bottom-bar button{
    border:none; border-radius:20px; padding:10px 20px; font-size:14px; font-weight:600; cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  #replace-btn{background:var(--gold); color:var(--navy); display:none;}
  #remove-btn{background:none; color:#e8b4b4; border:1px solid #6b4a4a !important; display:none;}
</style>
</head>
<body>

<header>
  <h1>JEE</h1>
  <button id="research-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    Research
  </button>
</header>

<main>
  <div id="status">Loading…</div>

  <div id="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    <div>No PDF uploaded yet. Tap Upload below to add your study document — it'll stay here permanently for both of you.</div>
  </div>

  <div id="pdf-card">
    <div id="pdf-toolbar">
      <b id="pdf-name">document.pdf</b>
      <a id="pdf-open" href="#" target="_blank" rel="noopener">Open full screen ↗</a>
    </div>
    <iframe id="pdf-frame"></iframe>
  </div>

  <div id="upload-zone" style="display:none;">
    <p>Choose a PDF file to upload — it will be saved permanently and visible to both of you.</p>
    <button id="upload-btn">📄 Choose PDF</button>
    <input type="file" id="file-input" accept="application/pdf">
  </div>
</main>

<div id="bottom-bar">
  <button id="remove-btn">Remove PDF</button>
  <button id="replace-btn">Replace PDF</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBX_xg3MTYFZLR3q6i7Rf2Ikz2Yii4X0MA",
    authDomain: "study-world-f04f4.firebaseapp.com",
    databaseURL: "https://study-world-f04f4-default-rtdb.firebaseio.com",
    projectId: "study-world-f04f4",
    storageBucket: "study-world-f04f4.firebasestorage.app",
    messagingSenderId: "458761318304",
    appId: "1:458761318304:web:d107447cbce7d77273bec5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const pdfRef = ref(db, "jeePdf");

  const statusEl = document.getElementById('status');
  const emptyState = document.getElementById('empty-state');
  const pdfCard = document.getElementById('pdf-card');
  const pdfFrame = document.getElementById('pdf-frame');
  const pdfName = document.getElementById('pdf-name');
  const pdfOpen = document.getElementById('pdf-open');
  const uploadZone = document.getElementById('upload-zone');
  const uploadBtn = document.getElementById('upload-btn');
  const fileInput = document.getElementById('file-input');
  const replaceBtn = document.getElementById('replace-btn');
  const removeBtn = document.getElementById('remove-btn');

  onValue(pdfRef, (snapshot)=>{
    const data = snapshot.val();
    statusEl.textContent = '';
    if(data && data.base64){
      emptyState.style.display = 'none';
      uploadZone.style.display = 'none';
      pdfCard.style.display = 'block';
      pdfFrame.src = data.base64;
      pdfOpen.href = data.base64;
      pdfName.textContent = data.name || 'document.pdf';
      replaceBtn.style.display = 'inline-block';
      removeBtn.style.display = 'inline-block';
    } else {
      pdfCard.style.display = 'none';
      emptyState.style.display = 'block';
      uploadZone.style.display = 'block';
      replaceBtn.style.display = 'none';
      removeBtn.style.display = 'none';
    }
  });

  function triggerUpload(){
    fileInput.click();
  }
  uploadBtn.onclick = triggerUpload;
  replaceBtn.onclick = triggerUpload;

  fileInput.addEventListener('change', ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    if(file.type !== 'application/pdf'){
      alert('Please choose a PDF file.');
      return;
    }
    const maxBytes = 8 * 1024 * 1024; // 8 MB soft limit
    if(file.size > maxBytes){
      alert('This PDF is quite large (' + Math.round(file.size/1024/1024) + ' MB). Please choose a file under 8 MB for reliable syncing.');
      return;
    }
    statusEl.textContent = 'Uploading…';
    const reader = new FileReader();
    reader.onload = ()=>{
      set(pdfRef, { base64: reader.result, name: file.name, time: Date.now() })
        .then(()=>{ statusEl.textContent = 'Saved'; setTimeout(()=>{statusEl.textContent='';}, 1500); })
        .catch((err)=>{ statusEl.textContent = 'Upload failed — try a smaller file.'; console.error(err); });
    };
    reader.onerror = ()=>{ statusEl.textContent = 'Could not read file.'; };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  removeBtn.onclick = ()=>{
    if(confirm('Remove this PDF for both of you?')){
      remove(pdfRef);
    }
  };

  document.getElementById('research-btn').onclick = ()=>{
    window.location.href = 'chat.html';
  };
</script>
</body>
</html>
